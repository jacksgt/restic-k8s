apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "restic-k8s.fullname" . }}-prune
  labels:
    {{- include "restic-k8s.labels" . | nindent 4 }}
    app.kubernetes.io/component: "prune"
spec:
  schedule: {{ .Values.restic.prune.schedule | quote }}
  suspend: {{ .Values.restic.prune.suspend }}
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        {{- include "restic-k8s.labels" . | nindent 8 }}
        app.kubernetes.io/component: "prune"
    spec:
      backoffLimit: 0 # do not retry this job
      template:
        metadata:
          {{- with .Values.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          restartPolicy: Never
          serviceAccountName: {{ include "restic-k8s.fullname" . }}-controller
          automountServiceAccountToken: true
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          {{- if or .Values.extraPruneInitContainers .Values.extraInitContainers }}
          initContainers:
            {{- if .Values.extraPruneInitContainers }}
            {{- toYaml .Values.extraPruneInitContainers | nindent 12 }}
            {{- end }}
            {{- if .Values.extraInitContainers }}
            {{- toYaml .Values.extraInitContainers | nindent 12 }}
            {{- end }}
          {{- end }}
          containers:
            - name: "restic"
              command:
                - "restic-k8s"
                - "prune"
                - "--namespace={{ .Release.Namespace }}"
                - "--config-secret={{ include "restic-k8s.configSecretName" . }}"
                - "--image={{ .Values.image.repository }}:{{ .Values.image.tag }}"
                {{- if .Values.restic.prune.dryRun }}
                - "--restic-dry-run"
                {{- end }}
              securityContext:
                {{- toYaml .Values.securityContext | nindent 16 }}
              image: {{ include "restic-k8s.image" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              env:
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              {{- if or .Values.extraPruneVolumeMounts .Values.extraVolumeMounts }}
              volumeMounts:
                {{- if .Values.extraPruneVolumeMounts }}
                {{- toYaml .Values.extraPruneVolumeMounts | nindent 16 }}
                {{- end }}
                {{- if .Values.extraVolumeMounts }}
                {{- toYaml .Values.extraVolumeMounts | nindent 16 }}
                {{- end }}
              {{- end }}
            {{- if .Values.extraPruneContainers }}
            {{- toYaml .Values.extraPruneContainers | nindent 12 }}
            {{- end }}
            {{- if .Values.extraContainers }}
            {{- toYaml .Values.extraContainers | nindent 12 }}
            {{- end }}
          {{- if or .Values.extraPruneVolumes .Values.extraVolumes }}
          volumes:
            {{- if .Values.extraPruneVolumes }}
            {{- toYaml .Values.extraPruneVolumes | nindent 12 }}
            {{- end }}
            {{- if .Values.extraVolumes }}
            {{- toYaml .Values.extraVolumes | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
